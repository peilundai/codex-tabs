name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Reject development files in VSIX
        shell: bash
        run: |
          files="$(unzip -Z1 codex-cli-tabs-*.vsix)"
          if printf '%s\n' "$files" | grep -E '/(src|test|reference|\.github)/|PUBLISH_AND_OPENSOURCE_REVIEW|RESTORE_OPEN_CHATS_PLAN|(^|/)artifacts/'; then
            echo "Development-only files were packaged" >&2
            exit 1
          fi
          if ! printf '%s\n' "$files" | grep -q 'extension/scripts/codex-pty-bridge.py'; then
            echo "PTY bridge was not packaged" >&2
            exit 1
          fi
          if ! printf '%s\n' "$files" | grep -q 'extension/PRIVACY.md'; then
            echo "Privacy policy was not packaged" >&2
            exit 1
          fi
          if unzip -l codex-cli-tabs-*.vsix | awk '
            $0 ~ /----/ { separators++; next }
            separators == 1 && $1+0 > 500000 { print; bad=1 }
            END { exit bad+0 }
          '; then
            echo "A packaged file exceeds 500KB" >&2
            exit 1
          fi

